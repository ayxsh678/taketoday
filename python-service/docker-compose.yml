version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: taketoday_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taketoday
      POSTGRES_USER: taketoday_user
      POSTGRES_PASSWORD: taketoday_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taketoday_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-service:
    build: .
    container_name: taketoday_python_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://taketoday_user:taketoday_pass@postgres:5432/taketoday
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-your-super-secret-internal-token-here}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-your-gemini-api-key-here}
      PORT: 8000
      HOST: 0.0.0.0
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.pytest_cache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: